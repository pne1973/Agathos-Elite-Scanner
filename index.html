<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agathos Elite Scanner - Real-Time Solana Hunter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #050505; --card: #121212; --white: #eee; --green: #00ff00; }
        * { box-sizing: border-box; }
        body { background: var(--dark); color: var(--white); font-family: 'Inter', sans-serif; margin: 0; padding: 15px; }
        
        .header { text-align: center; padding: 30px 0; }
        h1 { color: var(--gold); font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; margin: 0; text-transform: uppercase; }

        .info-box { max-width: 800px; margin: 0 auto 30px; background: #1a1a1a; border: 1px dashed var(--gold); padding: 20px; border-radius: 12px; text-align: center; }
        .info-box h2 { color: var(--gold); font-size: 1rem; margin-top: 0; }
        .info-box p { font-size: 0.85rem; color: #ccc; margin: 5px 0; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        
        .card { background: var(--card); border: 2px solid #1a1a1a; padding: 25px; border-radius: 16px; transition: 0.2s; }
        .card:hover { border-color: var(--gold); }
        .token-info { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
        .symbol { font-size: 1.4rem; font-weight: 900; color: var(--gold); }
        
        .price { font-size: 1.8rem; font-family: monospace; font-weight: bold; margin: 10px 0; color: #fff; }

        .params { background: #000; padding: 10px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #222; }
        .param-row { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 4px; }
        .label { color: #666; text-transform: uppercase; }
        .val { color: var(--green); font-weight: bold; }

        .btn-group { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .btn { display: flex; align-items: center; justify-content: center; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; transition: 0.2s; }
        .btn-buy { background: var(--gold); color: #000; }
        .btn-check { background: transparent; color: #aaa; border: 2px solid #2a2a2a; }

        #loader { text-align: center; color: var(--gold); padding: 50px; text-transform: uppercase; letter-spacing: 2px; }
        
        @media (min-width: 768px) {
            .btn-group { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Agathos Elite Scanner</h1>
        <div class="desc">Real-Time Solana Hunter</div>
    </div>

    <div class="info-box">
        <h2>How it works</h2>
        <p>1. Browse unique tokens with <b>Liquidity > $15k</b>.</p>
        <p>2. Verify safety to avoid Rug Pulls.</p>
        <p>3. Snipe instantly via Trojan Bot.</p>
    </div>

    <div id="loader">Cleaning duplicates and fetching gems...</div>
    <div class="grid" id="container"></div>

    <script>
        const MY_ID = "pine1971"; 
        const BOT_LINK = `https://t.me/solana_trojanbot?start=r-${MY_ID}`;

        async function updateScanner() {
            try {
                // Procuramos por tokens ativos na Raydium (Solana)
                const res = await fetch('https://api.dexscreener.com/latest/dex/search?q=raydium%20solana');
                const data = await res.json();
                const container = document.getElementById('container');
                document.getElementById('loader').style.display = 'none';
                container.innerHTML = '';

                const seenTokens = new Set(); // Conjunto para armazenar IDs únicos
                const filtered = data.pairs.filter(p => {
                    const isNew = !seenTokens.has(p.baseToken.address);
                    const hasLiq = p.liquidity && p.liquidity.usd > 15000;
                    
                    if (isNew && hasLiq) {
                        seenTokens.add(p.baseToken.address); // Regista o token para não repetir
                        return true;
                    }
                    return false;
                });

                filtered.slice(0, 15).forEach(p => {
                    const addr = p.baseToken.address;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="token-info">
                            <span class="symbol">${p.baseToken.symbol}</span>
                        </div>
                        <div class="price">$${p.priceUsd}</div>
                        
                        <div class="params">
                            <div class="param-row">
                                <span class="label">Liquidity:</span>
                                <span class="val">$${Math.round(p.liquidity.usd).toLocaleString()}</span>
                            </div>
                            <div class="param-row">
                                <span class="label">Volume 24h:</span>
                                <span class="val">$${Math.round(p.volume.h24).toLocaleString()}</span>
                            </div>
                            <div class="param-row">
                                <span class="label">Network:</span>
                                <span class="val">Solana</span>
                            </div>
                        </div>

                        <div class="btn-group">
                            <a href="https://rugcheck.xyz/tokens/${addr}" target="_blank" class="btn btn-check">Verify</a>
                            <a href="${BOT_LINK}-${addr}" target="_blank" class="btn btn-buy">Snipe Now</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) { console.error(err); }
        }

        updateScanner();
        setInterval(updateScanner, 30000);
    </script>
</body>
</html>
