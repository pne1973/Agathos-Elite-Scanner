<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agathos Elite Hunter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #050505; --card: #121212; --green: #00ff00; }
        * { box-sizing: border-box; }
        body { background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 30px 0; border-bottom: 1px solid #1a1a1a; margin-bottom: 30px; }
        h1 { color: var(--gold); font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border: 2px solid #1a1a1a; padding: 20px; border-radius: 15px; transition: 0.3s; }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .symbol { font-size: 1.4rem; font-weight: 900; color: #fff; margin-bottom: 5px; display: block; }
        .ca-box { background: #000; padding: 10px; border-radius: 8px; font-size: 0.65rem; color: #555; font-family: monospace; word-break: break-all; margin-bottom: 15px; border: 1px solid #222; }
        .price { font-size: 1.6rem; font-family: monospace; font-weight: bold; margin-bottom: 15px; color: var(--gold); }
        .params { background: #000; padding: 12px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #1a1a1a; }
        .param-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 8px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        .btn { display: flex; align-items: center; justify-content: center; padding: 14px; border-radius: 10px; text-decoration: none; font-weight: 900; font-size: 0.85rem; text-transform: uppercase; border: none; cursor: pointer; transition: 0.2s; }
        .btn-buy { background: var(--gold); color: #000; }
        .btn-check { background: transparent; color: #888; border: 1px solid #333; flex: 1; font-size: 0.7rem; }
        .btn-check:hover { border-color: var(--gold); color: var(--gold); }
        #loader { text-align: center; color: var(--gold); padding: 100px; font-weight: 900; }
    </style>
</head>
<body>
    <div class="header"><h1>Agathos Elite Hunter</h1></div>
    <div id="loader">HUNTING LIVE SOLANA GEMS...</div>
    <div class="grid" id="container"></div>

    <script>
        const BOT_LINK = `https://t.me/solana_trojanbot?start=r-pine1971`;
        const blacklist = ['SOL', 'USDC', 'RAY', 'USDT', 'WSOL', 'DAI', 'BTC', 'ETH', 'JUP', 'PYTH'];

        async function updateScanner() {
            try {
                // Using the "latest" endpoint which is much more stable than "search"
                const res = await fetch('https://api.dexscreener.com/latest/dex/tokens/solana');
                const data = await res.json();
                if (!data.pairs) {
                    // Fallback to search if latest endpoint is busy
                    const searchRes = await fetch('https://api.dexscreener.com/latest/dex/search?q=solana');
                    const searchData = await searchRes.json();
                    renderTokens(searchData.pairs);
                } else {
                    renderTokens(data.pairs);
                }
            } catch (err) { console.error("API Error:", err); }
        }

        function renderTokens(pairs) {
            if (!pairs) return;
            const container = document.getElementById('container');
            const seen = new Set();
            
            const filtered = pairs.filter(p => {
                const sym = p.baseToken.symbol.toUpperCase();
                const liq = p.liquidity?.usd || 0;
                // Standardizing filters to show active tokens only
                return !blacklist.includes(sym) && !seen.has(p.baseToken.address) && liq > 5000;
            });

            if (filtered.length > 0) {
                document.getElementById('loader').style.display = 'none';
                container.innerHTML = '';
                filtered.slice(0, 12).forEach(p => {
                    seen.add(p.baseToken.address);
                    const addr = p.baseToken.address;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <span class="symbol">${p.baseToken.symbol}</span>
                        <div class="ca-box">${addr}</div>
                        <div class="price">$${parseFloat(p.priceUsd).toFixed(8)}</div>
                        <div class="params">
                            <div class="param-row"><span>Liquidity</span><span style="color:var(--green)">$${Math.round(p.liquidity.usd).toLocaleString()}</span></div>
                            <div class="param-row"><span>24h Volume</span><span>$${Math.round(p.volume.h24).toLocaleString()}</span></div>
                        </div>
                        <div class="btn-group">
                            <div style="display:flex;gap:8px;">
                                <a href="https://rugcheck.xyz/tokens/${addr}" target="_blank" class="btn btn-check">Verify 1</a>
                                <a href="https://dexscreener.com/solana/${addr}" target="_blank" class="btn btn-check">Verify 2</a>
                            </div>
                            <a href="${BOT_LINK}-${addr}" target="_blank" class="btn btn-buy">Snipe on Trojan</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        updateScanner();
        setInterval(updateScanner, 20000); // 20s refresh
    </script>
</body>
</html>
