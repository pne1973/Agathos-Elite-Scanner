<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agathos Elite Hunter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #050505; --card: #121212; --green: #00ff00; }
        * { box-sizing: border-box; outline: none; }
        body { background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 40px 0; border-bottom: 1px solid #1a1a1a; margin-bottom: 40px; }
        h1 { color: var(--gold); font-size: 2rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border: 2px solid #1a1a1a; padding: 25px; border-radius: 20px; transition: 0.3s; position: relative; overflow: hidden; }
        .card:hover { border-color: var(--gold); transform: translateY(-5px); }
        
        .symbol-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .symbol { font-size: 1.5rem; font-weight: 900; color: #fff; }
        .tag { font-size: 0.65rem; background: rgba(0,255,0,0.1); color: var(--green); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--green); font-weight: bold; }
        
        .ca-box { background: #000; padding: 12px; border-radius: 10px; font-size: 0.7rem; color: #555; font-family: monospace; word-break: break-all; margin-bottom: 20px; border: 1px solid #222; position: relative; cursor: pointer; }
        .ca-box:hover { color: var(--gold); border-color: var(--gold); }
        
        .price { font-size: 2rem; font-family: monospace; font-weight: bold; margin-bottom: 20px; color: #fff; }
        .params { background: #000; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #1a1a1a; }
        .param-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 10px; }
        .label { color: #666; }
        .val { color: #eee; font-weight: bold; }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .btn { display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; transition: 0.2s; border: none; cursor: pointer; }
        .btn-buy { background: var(--gold); color: #000; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        .btn-check { background: transparent; color: #888; border: 1px solid #333; flex: 1; font-size: 0.75rem; }
        .btn-check:hover { border-color: var(--gold); color: var(--gold); }
        
        #loader { text-align: center; color: var(--gold); padding: 100px; font-weight: bold; font-size: 1.2rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Agathos Elite Hunter</h1>
        <p style="font-size: 0.8rem; color: #444; margin-top: 10px;">PREMIUM SOLANA SCANNER • LIVE DATA</p>
    </div>

    <div id="loader">FILTERING FOR PROMISING GEMS...</div>
    <div class="grid" id="container"></div>

    <script>
        const BOT_LINK = `https://t.me/solana_trojanbot?start=r-pine1971`;

        async function updateScanner() {
            try {
                // Fetching specifically for trending pairs to find new "promising" ones
                const res = await fetch('https://api.dexscreener.com/latest/dex/search?q=solana%20pump');
                const data = await res.json();
                const container = document.getElementById('container');
                document.getElementById('loader').style.display = 'none';
                container.innerHTML = '';

                const seen = new Set();
                // EXCLUSION LIST: Stops SOL and RAY from appearing
                const blacklist = ['SOL', 'USDC', 'RAY', 'USDT', 'WSOL', 'DAI', 'BTC', 'ETH'];

                const filtered = data.pairs.filter(p => {
                    const symbol = p.baseToken.symbol.toUpperCase();
                    const liq = p.liquidity?.usd || 0;
                    const vol = p.volume?.h24 || 0;
                    
                    // PROMISOR FILTERS: Liquidity > $20k, Volume > $50k [cite: 2026-03-22]
                    if (!blacklist.includes(symbol) && !seen.has(p.baseToken.address) && liq > 20000 && vol > 50000) {
                        seen.add(p.baseToken.address);
                        return true;
                    }
                    return false;
                });

                if (filtered.length === 0) {
                    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#444;">No high-conviction tokens found right now. Refreshing...</div>';
                }

                filtered.slice(0, 9).forEach(p => {
                    const addr = p.baseToken.address;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="symbol-row">
                            <span class="symbol">${p.baseToken.symbol}</span>
                            <span class="tag">PROMISING</span>
                        </div>
                        <div class="ca-box" onclick="navigator.clipboard.writeText('${addr}');alert('CA Copied!')">${addr}</div>
                        <div class="price">$${parseFloat(p.priceUsd).toFixed(8)}</div>
                        <div class="params">
                            <div class="param-row"><span class="label">Liquidity</span><span class="val" style="color:var(--green)">$${Math.round(p.liquidity.usd).toLocaleString()}</span></div>
                            <div class="param-row"><span class="label">24h Volume</span><span class="val">$${Math.round(p.volume.h24).toLocaleString()}</span></div>
                        </div>
                        <div class="btn-group">
                            <div style="display:flex;gap:10px;">
                                <a href="https://rugcheck.xyz/tokens/${addr}" target="_blank" class="btn btn-check">Verify Safety</a>
                                <a href="https://dexscreener.com/solana/${addr}" target="_blank" class="btn btn-check">View Chart</a>
                            </div>
                            <a href="${BOT_LINK}-${addr}" target="_blank" class="btn btn-buy">Snipe on Trojan</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) { console.error(err); }
        }

        updateScanner();
        setInterval(updateScanner, 30000); // 30s auto-refresh
    </script>
</body>
</html>
