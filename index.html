<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Hunter Pro - Live Feed</title>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #0a0b10;
            --card: #161821;
            --text: #ffffff;
            --danger: #ff4444;
            --warning: #ffbb00;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .live-indicator {
            color: var(--primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--primary);
        }

        .token-grid {
            display: grid;
            gap: 15px;
        }

        .token-card {
            background: var(--card);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #222;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .token-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .network-tag { background: #333; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
            font-size: 0.9rem;
        }

        .stat-item { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; border: 1px solid #222; }

        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-dex { background: var(--primary); color: #000; }
        .btn-copy { background: #2a2d3a; color: #fff; }

        #loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Crypto Hunter 🎯</h1>
        <div class="live-indicator"><span class="dot"></span> Live DEX Feed</div>
    </div>

    <div id="loading">A ligar aos nós da Blockchain...</div>
    <div class="token-grid" id="feed"></div>

    <script>
        const feedElement = document.getElementById('feed');
        const loadingElement = document.getElementById('loading');

        // Função para calcular Score Baseado em Dados Reais
        function calculateScore(pair) {
            let score = 50; // Base
            if (pair.liquidity?.usd > 50000) score += 20;
            if (pair.volume?.h24 > 100000) score += 15;
            if (pair.boosts?.active > 0) score += 15;
            return Math.min(score, 100);
        }

        async function fetchLatestTokens() {
            try {
                // Endpoint da DexScreener para os tokens com boosts/recentes
                const response = await fetch('https://api.dexscreener.com/token-profiles/latest/v1');
                const data = await response.json();
                
                loadingElement.style.display = 'none';
                feedElement.innerHTML = '';

                // Limitamos aos primeiros 10 para performance
                data.slice(0, 10).forEach(token => {
                    const score = calculateScore(token);
                    const color = score > 70 ? '#00ff88' : (score > 40 ? '#ffbb00' : '#ff4444');
                    
                    const card = `
                        <div class="token-card">
                            <div class="token-header">
                                <div>
                                    <span class="network-tag">${token.chainId}</span>
                                    <h3 style="margin: 5px 0;">${token.symbol}</h3>
                                </div>
                                <div style="text-align: right">
                                    <span style="color: ${color}; font-weight: bold; font-size: 1.2rem;">${score}/100</span>
                                    <br><small style="color: #666">Trust Score</small>
                                </div>
                            </div>
                            
                            <div class="stats">
                                <div class="stat-item"><strong>Rede:</strong> ${token.chainId}</div>
                                <div class="stat-item"><strong>Bio:</strong> ${token.description ? 'Sim' : 'Não'}</div>
                            </div>

                            <div class="btn-group">
                                <button class="btn-dex" onclick="window.open('${token.url}', '_blank')">Ver Gráfico</button>
                                <button class="btn-copy" onclick="navigator.clipboard.writeText('${token.tokenAddress}'); alert('Endereço Copiado!')">Copiar CA</button>
                            </div>
                        </div>
                    `;
                    feedElement.innerHTML += card;
                });
            } catch (error) {
                loadingElement.innerText = "Erro ao carregar dados. Tente novamente.";
                console.error(error);
            }
        }

        // Atualiza a cada 30 segundos
        fetchLatestTokens();
        setInterval(fetchLatestTokens, 30000);
    </script>
</body>
</html>
