<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agathos Elite Hunter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #050505; --card: #121212; --green: #00ff00; }
        * { box-sizing: border-box; }
        body { background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 20px 0; }
        h1 { color: var(--gold); font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1100px; margin: 20px auto; }
        .card { background: var(--card); border: 2px solid #1a1a1a; padding: 20px; border-radius: 15px; transition: 0.3s; }
        .card:hover { border-color: var(--gold); }
        .symbol-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .symbol { font-size: 1.2rem; font-weight: 900; color: var(--gold); }
        .ca-box { background: #000; padding: 8px; border-radius: 5px; font-size: 0.65rem; color: #666; font-family: monospace; word-break: break-all; margin-bottom: 15px; border: 1px solid #222; }
        .price { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; }
        .params { background: #000; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 0.8rem; }
        .param-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .btn { display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; border: none; cursor: pointer; }
        .btn-buy { background: var(--gold); color: #000; }
        .btn-check { background: transparent; color: #aaa; border: 1px solid #333; flex: 1; }
        #loader { text-align: center; color: var(--gold); padding: 50px; }
    </style>
</head>
<body>
    <div class="header"><h1>Agathos Elite Hunter</h1></div>
    <div id="loader">SEARCHING FOR LIVE TOKENS...</div>
    <div class="grid" id="container"></div>

    <script>
        const BOT_LINK = `https://t.me/solana_trojanbot?start=r-pine1971`;

        async function updateScanner() {
            try {
                const res = await fetch('https://api.dexscreener.com/latest/dex/search?q=solana');
                const data = await res.json();
                const container = document.getElementById('container');
                document.getElementById('loader').style.display = 'none';
                container.innerHTML = '';

                const seen = new Set();
                const filtered = data.pairs.filter(p => {
                    const liq = p.liquidity?.usd || 0;
                    const vol = p.volume?.h24 || 0;
                    if (liq > 15000 && vol > 50000 && !seen.has(p.baseToken.address)) {
                        seen.add(p.baseToken.address);
                        return true;
                    }
                    return false;
                });

                filtered.slice(0, 10).forEach(p => {
                    const addr = p.baseToken.address;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="symbol-row"><span class="symbol">${p.baseToken.symbol}</span></div>
                        <div class="ca-box">${addr}</div>
                        <div class="price">$${parseFloat(p.priceUsd).toFixed(8)}</div>
                        <div class="params">
                            <div class="param-row"><span>Liquidity:</span><span style="color:var(--green)">$${Math.round(p.liquidity.usd).toLocaleString()}</span></div>
                            <div class="param-row"><span>Volume:</span><span>$${Math.round(p.volume.h24).toLocaleString()}</span></div>
                        </div>
                        <div class="btn-group">
                            <div style="display:flex;gap:5px;">
                                <a href="https://rugcheck.xyz/tokens/${addr}" target="_blank" class="btn btn-check">RugCheck</a>
                                <a href="https://dexscreener.com/solana/${addr}" target="_blank" class="btn btn-check">DexView</a>
                            </div>
                            <a href="${BOT_LINK}-${addr}" target="_blank" class="btn btn-buy">Snipe on Trojan</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }
        updateScanner();
        setInterval(updateScanner, 30000);
    </script>
</body>
</html>
