<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agathos Elite Hunter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --dark: #050505; --card: #121212; --green: #00ff00; }
        body { background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #1a1a1a; }
        h1 { color: var(--gold); font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
        .card { background: var(--card); border: 1px solid #222; padding: 20px; border-radius: 12px; }
        .card:hover { border-color: var(--gold); }
        .symbol { font-size: 1.2rem; font-weight: 900; color: var(--gold); margin-bottom: 10px; display: block; }
        .ca-box { background: #000; padding: 8px; border-radius: 5px; font-size: 0.6rem; color: #555; word-break: break-all; margin-bottom: 15px; border: 1px solid #1a1a1a; }
        .price { font-size: 1.4rem; font-weight: bold; margin-bottom: 15px; font-family: monospace; }
        .stats { font-size: 0.8rem; margin-bottom: 15px; color: #aaa; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; }
        .btn { padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; text-align: center; font-size: 0.8rem; text-transform: uppercase; border: none; cursor: pointer; }
        .btn-buy { background: var(--gold); color: #000; }
        .btn-check { background: transparent; color: #888; border: 1px solid #333; }
        #status { text-align: center; color: var(--gold); margin-top: 50px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header"><h1>Agathos Elite Hunter</h1></div>
    <div id="status">CONECTANDO À SOLANA...</div>
    <div class="grid" id="container"></div>

    <script>
        const BOT_LINK = `https://t.me/solana_trojanbot?start=r-pine1971`;
        // Blacklist para evitar os tokens de sistema que dão erro [cite: 2026-03-24]
        const ignore = ['SOL', 'USDC', 'RAY', 'USDT', 'WSOL', 'JUP', 'PYTH'];

        async function hunt() {
            try {
                // Busca geral por tokens ativos na Solana [cite: 2026-03-22]
                const response = await fetch('https://api.dexscreener.com/latest/dex/search?q=solana');
                const data = await response.json();
                const container = document.getElementById('container');
                
                if (!data.pairs || data.pairs.length === 0) return;
                
                document.getElementById('status').style.display = 'none';
                container.innerHTML = '';

                const seen = new Set();
                const filtered = data.pairs.filter(p => {
                    const sym = p.baseToken.symbol.toUpperCase();
                    const liq = p.liquidity?.usd || 0;
                    // Filtro mínimo de 5k para garantir que apareça algo [cite: 2026-03-22]
                    return !ignore.includes(sym) && !seen.has(p.baseToken.address) && liq > 5000;
                });

                filtered.slice(0, 12).forEach(p => {
                    seen.add(p.baseToken.address);
                    const addr = p.baseToken.address;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <span class="symbol">${p.baseToken.symbol}</span>
                        <div class="ca-box">${addr}</div>
                        <div class="price">$${parseFloat(p.priceUsd).toFixed(8)}</div>
                        <div class="stats">
                            Liq: <span style="color:var(--green)">$${Math.round(p.liquidity.usd).toLocaleString()}</span> | 
                            Vol: $${Math.round(p.volume.h24).toLocaleString()}
                        </div>
                        <div class="btn-group">
                            <div style="display:flex;gap:5px;">
                                <a href="https://rugcheck.xyz/tokens/${addr}" target="_blank" class="btn btn-check" style="flex:1">RugCheck</a>
                                <a href="https://dexscreener.com/solana/${addr}" target="_blank" class="btn btn-check" style="flex:1">Gráfico</a>
                            </div>
                            <a href="${BOT_LINK}-${addr}" target="_blank" class="btn btn-buy">Snipe no Trojan Bot</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { 
                console.error(e); 
                document.getElementById('status').innerText = "ERRO DE CONEXÃO. TENTE REFRESH.";
            }
        }

        hunt();
        setInterval(hunt, 20000); // Atualiza a cada 20s [cite: 2026-03-22]
    </script>
</body>
</html>
